spring.application.name=SpringEduManager

# Configuración de la base de datos H2 (activa para la entrega — no requiere instalación)
spring.datasource.url=jdbc:h2:mem:springedu
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de la base de datos MariaDB (usada durante el desarrollo, ver README)
#spring.datasource.url=jdbc:mariadb://localhost:3306/springedu
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.datasource.username=springuser
#spring.datasource.password=springpass123

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true