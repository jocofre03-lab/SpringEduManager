<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Courses</title>
</head>
<body>
<h1>Course List</h1>
<ul>
    <li th:each="course : ${courseList}">
        <span th:text="${course.name}">Name</span> -
        <span th:text="${course.code}">Code</span>
    </li>
</ul>
</body>
</html>
